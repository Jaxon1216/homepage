<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">webpack 从模块依赖图生成静态资源</title>
  <desc id="desc">左侧从 index.js 入口出发，箭头指向它引用的 app.js 和 page.hbs，以及后续引用的 Sass 和图片。中间是 webpack，右侧是生成的 JavaScript、CSS 和图片文件。</desc>
  <defs>
    <marker id="dep-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 8 4.5 1 8" fill="none" stroke="#bfdae7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="bundle-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#91b6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
      .heading{font-size:46px;font-weight:680;fill:#f8fbfd;letter-spacing:-1px}
      .node{fill:#2c3d47;stroke:#607d8b;stroke-width:3}
      .node-text{font-size:18px;font-weight:650;fill:#f5fafc}
      .caption{font-size:15px;font-weight:750;letter-spacing:1px;fill:#93b4c6}
      .hint{font-size:13px;fill:#9eb8c6}
      .dependency{fill:none;stroke:#bfdae7;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#dep-arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#293a44"/>
  <text x="600" y="75" class="heading" text-anchor="middle">webpack：沿依赖图打包资源</text>

  <!-- 所有连线停在节点外缘；箭头沿“引用方 → 被引用方”的方向。 -->
  <path class="dependency" d="M158 224 H225"/>
  <path class="dependency" d="M116 266 V349"/>
  <path class="dependency" d="M309 224 H344 V328 H385"/>
  <path class="dependency" d="M267 266 V349"/>
  <path class="dependency" d="M267 433 V474 H116 V499"/>
  <path class="dependency" d="M309 391 H347 V541 H385"/>

  <g text-anchor="middle">
    <rect class="node" x="74" y="182" width="84" height="84" rx="5"/><text class="node-text" x="116" y="218">index</text><text class="node-text" x="116" y="242">.js</text>
    <rect class="node" x="225" y="182" width="84" height="84" rx="5"/><text class="node-text" x="267" y="230">app.js</text>
    <rect class="node" x="74" y="349" width="84" height="84" rx="5"/><text class="node-text" x="116" y="397">page.hbs</text>
    <rect class="node" x="225" y="349" width="84" height="84" rx="5"/><text class="node-text" x="267" y="386">main</text><text class="node-text" x="267" y="410">.sass</text>
    <rect class="node" x="385" y="286" width="84" height="84" rx="5"/><text class="node-text" x="427" y="334">logo.png</text>
    <rect class="node" x="74" y="499" width="84" height="84" rx="5"/><text class="node-text" x="116" y="536">theme</text><text class="node-text" x="116" y="560">.sass</text>
    <rect class="node" x="385" y="499" width="84" height="84" rx="5"/><text class="node-text" x="427" y="547">hero.jpg</text>
  </g>
  <text x="74" y="617" class="caption">MODULES WITH DEPENDENCIES</text>
  <text x="74" y="639" class="hint">箭头：引用方 → 依赖模块</text>

  <path d="M505 327 C555 346 579 351 617 360" stroke="#819ba8" stroke-width="4" stroke-dasharray="8 8" fill="none" marker-end="url(#bundle-arrow)"/>
  <path d="M505 524 C557 503 580 495 617 482" stroke="#819ba8" stroke-width="4" stroke-dasharray="8 8" fill="none" marker-end="url(#bundle-arrow)"/>
  <g transform="translate(622 280)">
    <path d="M103 0 206 59 206 177 103 236 0 177 0 59Z" fill="#77b2d0" stroke="#fff" stroke-width="5"/>
    <path d="M103 0 206 59 103 118 0 59Z" fill="#90c4dc" stroke="#fff" stroke-width="2"/>
    <path d="M0 59 103 118 103 236 0 177Z" fill="#70b2d4" stroke="#fff" stroke-width="2"/>
    <path d="M206 59 103 118 103 236 206 177Z" fill="#4a99ca" stroke="#fff" stroke-width="2"/>
    <path d="M103 67 148 93 103 119 58 93Z" fill="#449bd2" stroke="#dff3ff" stroke-width="2"/>
    <path d="M58 93 103 119 103 171 58 145Z" fill="#3293cf" stroke="#dff3ff" stroke-width="2"/>
    <path d="M148 93 103 119 103 171 148 145Z" fill="#257db9" stroke="#dff3ff" stroke-width="2"/>
  </g>
  <text x="725" y="555" class="caption" text-anchor="middle">WEBPACK</text>

  <path d="M843 399 H897" stroke="#91b6c8" stroke-width="4" stroke-dasharray="8 8" fill="none" marker-end="url(#bundle-arrow)"/>
  <g text-anchor="middle">
    <rect class="node" x="920" y="246" width="109" height="92" rx="5"/><text class="node-text" x="974" y="301">.js</text>
    <rect class="node" x="1049" y="246" width="109" height="92" rx="5"/><text class="node-text" x="1103" y="301">.css</text>
    <rect class="node" x="920" y="365" width="109" height="92" rx="5"/><text class="node-text" x="974" y="420">.jpg</text>
    <rect class="node" x="1049" y="365" width="109" height="92" rx="5"/><text class="node-text" x="1103" y="420">.png</text>
  </g>
  <text x="1039" y="502" class="caption" text-anchor="middle">STATIC ASSETS</text>
</svg>
