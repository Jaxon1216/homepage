<circle data-role="phase-dot" cx="642.6" cy="156.0" r="5.76" fill="#7b67c9" stroke="none" stroke-width="2"/>
<text data-role="label" x="642.6" y="137.1" font-family="Noto Sans SC" font-size="24" font-weight="700" text-anchor="middle" fill="#7b67c9">render</text>
<text data-role="label" x="642.6" y="188.4" font-family="Noto Sans SC" font-size="18" font-weight="400" text-anchor="middle" fill="#4e5969">计算新结果</text>
<polyline data-role="connector" points="654.3000000000001,156.0 921.4200000000001,156.0" fill="none" stroke="#5b7fcb" stroke-width="2"/>
<polyline data-role="line-arrow" points="914.94,149.52 921.4200000000001,156.0 914.94,162.48" fill="none" stroke="#5b7fcb" stroke-width="2"/>
