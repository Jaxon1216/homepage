<svg xmlns="http://www.w3.org/2000/svg" width="1278" height="696" viewBox="0 0 1278 696">
<title>一次状态更新：render 与 commit</title>
<desc>更新从触发、调度、render、commit 到浏览器显示；render 准备新结果时旧页面仍可见，commit 同步修改当前 DOM 并切换 current。</desc>
