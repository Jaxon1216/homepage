<text data-role="label" x="374.22" y="137.1" font-family="Noto Sans SC" font-size="24" font-weight="700" text-anchor="middle" fill="#5b7fcb">加入更新 / 调度</text>
<text data-role="label" x="374.22" y="188.4" font-family="Noto Sans SC" font-size="18" font-weight="400" text-anchor="middle" fill="#4e5969">决定何时开始工作</text>
<polyline data-role="connector" points="385.92,156.0 629.1,156.0" fill="none" stroke="#5b7fcb" stroke-width="2"/>
