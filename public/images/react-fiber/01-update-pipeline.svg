<text data-role="label" x="934.9200000000001" y="137.1" font-family="Noto Sans SC" font-size="24" font-weight="700" text-anchor="middle" fill="#4e9d6d">commit</text>
<text data-role="label" x="934.9200000000001" y="188.4" font-family="Noto Sans SC" font-size="18" font-weight="400" text-anchor="middle" fill="#4e5969">同步提交变化</text>
<polyline data-role="connector" points="946.6200000000001,156.0 1155.1200000000001,156.0" fill="none" stroke="#5b7fcb" stroke-width="2"/>
