<text data-role="label" x="36" y="66" font-family="Noto Sans SC" font-size="30" font-weight="700" text-anchor="start" fill="#1f2329">一次更新，两个阶段</text>
<text data-role="label" x="36" y="102" font-family="Noto Sans SC" font-size="18" font-weight="400" text-anchor="start" fill="#4e5969">一次已有列表更新：先计算新结果，再提交到当前页面</text>
<circle data-role="phase-dot" cx="136.98000000000002" cy="156.0" r="5.76" fill="#5b7fcb" stroke="none" stroke-width="2"/>
