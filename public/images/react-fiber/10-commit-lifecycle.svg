<svg xmlns="http://www.w3.org/2000/svg" width="1206" height="984.0" viewBox="0 0 1206 984.0">
<title>commit：DOM、生命周期与 Effects 的执行时机</title>
<desc>上部四阶段对齐轨道，root.current 位于 mutation 与 layout 之间；下部 passive cleanup→setup 与可变 paint 注释；最后以一个 DOM 删除局部例子展示卸载处理在相应节点移除之前。</desc>
