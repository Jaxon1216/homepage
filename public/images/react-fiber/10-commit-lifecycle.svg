<text data-role="label" x="54" y="903.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="bold" text-anchor="start">对应组件的卸载处理</text>
<text data-role="label" x="54" y="931.8" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">componentWillUnmount / layout cleanup</text>
<polyline data-role="local-cleanup-before-removal" points="594,916.5 684,916.5" fill="none" stroke="#c94c4c" stroke-width="2.0"/>
<polyline data-role="line-arrow" points="678.0,910.5 684,916.5 678.0,922.5" fill="none" stroke="#c94c4c" stroke-width="2.0"/>
