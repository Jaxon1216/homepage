<text data-role="label" x="714.0" y="264.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">新 current</text>
<rect data-role="commit-event" x="900" y="237.0" width="270" height="54" rx="6.0" fill="#eaf7ee" stroke="#4e9d6d" stroke-width="1.5"/>
<text data-role="label" x="912.0" y="264.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">DOM 已更新</text>
