<text data-role="label" x="426.0" y="336.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">componentWillUnmount</text>
<text data-role="label" x="426.0" y="363.0" font-family="Noto Sans SC" font-size="16" fill="#6b7280" font-weight="normal" text-anchor="start">卸载时；对应 DOM 移除前</text>
<rect data-role="commit-event" x="900" y="309.0" width="270" height="81.0" rx="6.0" fill="#ffffff" stroke="#dadde3" stroke-width="1.5"/>
<text data-role="label" x="912.0" y="336.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">componentDidUpdate</text>
<text data-role="label" x="912.0" y="363.0" font-family="Noto Sans SC" font-size="16" fill="#6b7280" font-weight="normal" text-anchor="start">挂载：componentDidMount</text>
<rect data-role="commit-event" x="414" y="417.0" width="270" height="81.0" rx="6.0" fill="#f3eeff" stroke="#7b67c9" stroke-width="1.5"/>
<text data-role="label" x="426.0" y="444.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">useLayoutEffect</text>
<text data-role="label" x="426.0" y="471.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">旧 cleanup</text>
<rect data-role="commit-event" x="900" y="417.0" width="270" height="81.0" rx="6.0" fill="#f3eeff" stroke="#7b67c9" stroke-width="1.5"/>
<text data-role="label" x="912.0" y="444.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">useLayoutEffect</text>
<text data-role="label" x="912.0" y="471.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">新 setup</text>
<rect data-role="commit-event" x="414" y="516.0" width="270" height="54" rx="6.0" fill="#ffffff" stroke="#dadde3" stroke-width="1.5"/>
<text data-role="label" x="426.0" y="543.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">相关 ref detach</text>
<rect data-role="commit-event" x="900" y="516.0" width="270" height="54" rx="6.0" fill="#ffffff" stroke="#dadde3" stroke-width="1.5"/>
<text data-role="label" x="912.0" y="543.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">ref attach</text>
<text data-role="mutation-order-note" x="36" y="606.0" font-family="Noto Sans SC" font-size="18" fill="#6b7280" font-weight="normal" text-anchor="start">mutation 内按 Fiber 遍历交错执行，不表示所有 cleanup 都先于所有 DOM 更改。</text>
<text data-role="sync-commit-note" x="36" y="636.6" font-family="Noto Sans SC" font-size="18" fill="#6b7280" font-weight="normal" text-anchor="start">普通同步 mutation / layout 连续执行，不能用时间切片中断。</text>
<text data-role="effect-dependency-note" x="36" y="667.2" font-family="Noto Sans SC" font-size="18" fill="#6b7280" font-weight="normal" text-anchor="start">Effect 轨以依赖变化为例；依赖不变时跳过对应 cleanup / setup。</text>
<text data-role="label" x="36" y="696.0" font-family="Noto Sans SC" font-size="24" fill="#5b7fcb" font-weight="bold" text-anchor="start">passive Effects</text>
<text data-role="label" x="36" y="726.6" font-family="Noto Sans SC" font-size="16" fill="#6b7280" font-weight="normal" text-anchor="start">commit 后处理</text>
<rect data-role="passive-old-cleanup" x="252" y="670.8" width="324" height="81.0" rx="6.0" fill="#eef3ff" stroke="#5b7fcb" stroke-width="1.5"/>
<text data-role="label" x="270" y="701.4" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">useEffect 旧 cleanup</text>
<text data-role="label" x="270" y="728.4" font-family="Noto Sans SC" font-size="16" fill="#6b7280" font-weight="normal" text-anchor="start">更新时先清理上一次 Effect</text>
<polyline data-role="passive-cleanup-setup" points="576,711.3 648,711.3" fill="none" stroke="#5b7fcb" stroke-width="2.0"/>
<polyline data-role="line-arrow" points="642.0,705.3 648,711.3 642.0,717.3" fill="none" stroke="#5b7fcb" stroke-width="2.0"/>
<rect data-role="passive-new-setup" x="648" y="670.8" width="324" height="81.0" rx="6.0" fill="#eef3ff" stroke="#5b7fcb" stroke-width="1.5"/>
<text data-role="label" x="666" y="701.4" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">useEffect 新 setup</text>
<text data-role="label" x="666" y="728.4" font-family="Noto Sans SC" font-size="16" fill="#6b7280" font-weight="normal" text-anchor="start">执行这次提交对应的 Effect</text>
<text data-role="mount-update-unmount-note" x="36" y="775.2" font-family="Noto Sans SC" font-size="18" fill="#6b7280" font-weight="normal" text-anchor="start">挂载没有旧 cleanup；更新先旧 cleanup 再新 setup；卸载只有 cleanup。</text>
<rect data-role="paint-flexible-position" x="36" y="786.0" width="1134" height="54" rx="6.0" fill="#fff4d9" stroke="#c8a33e" stroke-width="1.5"/>
<polyline data-role="paint-position-varies" points="54,813.0 108,813.0" fill="none" stroke="#c8a33e" stroke-width="2.0"/>
<polyline data-role="line-arrow" points="102.0,807.0 108,813.0 102.0,819.0" fill="none" stroke="#c8a33e" stroke-width="2.0"/>
<polyline data-role="line-arrow" points="60.0,807.0 54,813.0 60.0,819.0" fill="none" stroke="#c8a33e" stroke-width="2.0"/>
<text data-role="label" x="126" y="820.2" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">绘制机会：layout 后，passive 可能在浏览器 paint 前，也可能在 paint 后。</text>
<text data-role="label" x="36" y="867.0" font-family="Noto Sans SC" font-size="16" fill="#6b7280" font-weight="normal" text-anchor="start">局部看删除：只保证对应卸载处理先于该节点 DOM 移除</text>
