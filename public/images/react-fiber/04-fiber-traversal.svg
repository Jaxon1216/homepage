<text data-role="label" x="342.0" y="345.0" font-family="Noto Sans SC" font-size="16" fill="#5b7fcb" font-weight="normal" text-anchor="middle">sibling</text>
<text data-role="label" x="342.0" y="379.2" font-family="Noto Sans SC" font-size="16" fill="#5b7fcb" font-weight="normal" text-anchor="middle">转入兄弟</text>
<rect data-role="fiber-tree-node" x="270.0" y="210.0" width="144" height="54" rx="6.0" fill="#ffffff" stroke="#dadde3" stroke-width="2.0"/>
<text data-role="label" x="342.0" y="243.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="bold" text-anchor="middle">List</text>
<rect data-role="fiber-tree-node" x="117.0" y="327.0" width="144" height="54" rx="6.0" fill="#ffffff" stroke="#dadde3" stroke-width="2.0"/>
<text data-role="label" x="189.0" y="360.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="bold" text-anchor="middle">Row A</text>
<rect data-role="fiber-tree-node" x="423.0" y="327.0" width="144" height="54" rx="6.0" fill="#ffffff" stroke="#dadde3" stroke-width="2.0"/>
<text data-role="label" x="495.0" y="360.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="bold" text-anchor="middle">Row B</text>
<rect data-role="fiber-tree-node" x="117.0" y="444.0" width="144" height="54" rx="6.0" fill="#ffffff" stroke="#dadde3" stroke-width="2.0"/>
<text data-role="label" x="189.0" y="477.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="bold" text-anchor="middle">li A</text>
<rect data-role="fiber-tree-node" x="423.0" y="444.0" width="144" height="54" rx="6.0" fill="#ffffff" stroke="#dadde3" stroke-width="2.0"/>
<text data-role="label" x="495.0" y="477.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="bold" text-anchor="middle">li B</text>
<rect data-role="fiber-tree-node" x="117.0" y="561.0" width="144" height="54" rx="6.0" fill="#ffffff" stroke="#dadde3" stroke-width="2.0"/>
<text data-role="label" x="189.0" y="594.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="bold" text-anchor="middle">input A</text>
<rect data-role="fiber-tree-node" x="423.0" y="561.0" width="144" height="54" rx="6.0" fill="#ffffff" stroke="#dadde3" stroke-width="2.0"/>
<text data-role="label" x="495.0" y="594.0" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="bold" text-anchor="middle">input B</text>
<text data-role="ordered-trace-heading" x="720" y="219.0" font-family="Noto Sans SC" font-size="18" fill="#5b7fcb" font-weight="bold" text-anchor="start">① 向下 beginWork</text>
<text data-role="ordered-trace" x="720" y="247.8" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">List → Row A → li A → input A</text>
<text data-role="ordered-trace-heading" x="720" y="328.8" font-family="Noto Sans SC" font-size="18" fill="#7b67c9" font-weight="bold" text-anchor="start">② 无 child，开始 completeWork</text>
<text data-role="ordered-trace" x="720" y="357.6" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">input A → li A → Row A</text>
<text data-role="ordered-trace" x="720" y="384.6" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">Row A 有兄弟，转向 Row B</text>
<text data-role="ordered-trace-heading" x="720" y="438.6" font-family="Noto Sans SC" font-size="18" fill="#5b7fcb" font-weight="bold" text-anchor="start">③ 进入兄弟，再向下 beginWork</text>
<text data-role="ordered-trace" x="720" y="467.40000000000003" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">Row B → li B → input B</text>
<text data-role="ordered-trace-heading" x="720" y="548.4" font-family="Noto Sans SC" font-size="18" fill="#7b67c9" font-weight="bold" text-anchor="start">④ completeWork 一路回父</text>
<text data-role="ordered-trace" x="720" y="577.1999999999999" font-family="Noto Sans SC" font-size="18" fill="#1f2329" font-weight="normal" text-anchor="start">input B → li B → Row B → List</text>
<polyline data-role="footer-rule" points="36,669.0 1152,669.0" fill="none" stroke="#dadde3" stroke-width="2.0"/>
<text data-role="complete-summary" x="36" y="699.6" font-family="Noto Sans SC" font-size="18" fill="#7b67c9" font-weight="normal" text-anchor="start">completeWork：汇总 flags 等信息，并为宿主节点做准备。</text>
<text data-role="bailout-note" x="36" y="730.2" font-family="Noto Sans SC" font-size="18" fill="#6b7280" font-weight="normal" text-anchor="start">示意一次完整遍历；实际 render 可以 bailout，不必每个节点都重新计算。</text>
<text data-role="control-rule" x="36" y="759.0" font-family="Noto Sans SC" font-size="18" fill="#6b7280" font-weight="normal" text-anchor="start">不能再向下 → 完成当前节点 → 有兄弟进入兄弟；无兄弟则回父继续完成。</text>
</svg>