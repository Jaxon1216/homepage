<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="777.0" viewBox="0 0 1188 777.0">
<title>Fiber 怎么走：先向下，再回溯，遇到兄弟转过去</title>
<desc>左侧七节点树，树边无箭头，实际执行路径左右偏移；Row A 到 Row B 独立 sibling 箭头表示兄弟切换。右侧四段有序轨迹，底部解释 complete 和 bailout。</desc>
<rect data-role="canvas" x="0" y="0" width="1188" height="777.0" fill="#fbfcfd"/>
<text data-role="title" x="36" y="51.0" font-family="Noto Sans SC" font-size="30" fill="#1f2329" font-weight="bold" text-anchor="start">Fiber 怎么走：先向下，再回溯，遇到兄弟转过去</text>
<text data-role="label" x="36" y="87.0" font-family="Noto Sans SC" font-size="18" fill="#6b7280" font-weight="normal" text-anchor="start">beginWork 与 completeWork 组成一次深度优先遍历</text>
<polyline data-role="connector" points="36,150.0 72,150.0" fill="none" stroke="#5b7fcb" stroke-width="2.0"/>
<polyline data-role="line-arrow" points="66.0,144.0 72,150.0 66.0,156.0" fill="none" stroke="#5b7fcb" stroke-width="2.0"/>
<text data-role="label" x="81.0" y="156" font-family="Noto Sans SC" font-size="18" fill="#5b7fcb" font-weight="normal" text-anchor="start">beginWork 下探</text>
<polyline data-role="connector" points="342.0,150.0 378.0,150.0" fill="none" stroke="#7b67c9" stroke-width="2.0"/>
<polyline data-role="line-arrow" points="372.0,144.0 378.0,150.0 372.0,156.0" fill="none" stroke="#7b67c9" stroke-width="2.0"/>
<text data-role="label" x="387.0" y="156" font-family="Noto Sans SC" font-size="18" fill="#7b67c9" font-weight="normal" text-anchor="start">completeWork 回溯</text>
<text data-role="label" x="720" y="156" font-family="Noto Sans SC" font-size="24" fill="#1f2329" font-weight="bold" text-anchor="start">实际执行顺序</text>
<polyline data-role="neutral-tree-relation" points="342.0,264.0 342.0,295.5 189.0,295.5 189.0,327.0" fill="none" stroke="#dadde3" stroke-width="2.0"/>
