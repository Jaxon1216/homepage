<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1090" role="img" aria-labelledby="title desc">
<title id="title">Go GMP 调度模型全景</title><desc id="desc">全局可运行队列、每个 P 的本地队列、P 与操作系统线程 M、CPU 核心、工作窃取与网络等待的简化关系。</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7d9693"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#9671ad"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5485aa"/></marker></defs>
<rect width="1500" height="1090" rx="28" fill="#f5f8f7"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="52" y="69" font-size="38" font-weight="700" fill="#173843">Go GMP：goroutine 如何被调度到 CPU？</text>
<text x="53" y="106" font-size="20" fill="#687f84">三个 P 的示意图 · 箭头表示可能的路径，实际调度随运行状态变化</text>
<rect x="50" y="142" width="995" height="783" rx="21" fill="#fff" stroke="#d5e2df" stroke-width="2"/>
<text x="79" y="181" font-size="23" font-weight="700" fill="#234b47">Go runtime 调度</text><text x="620" y="181" font-size="20" font-weight="700" fill="#956b29">GOMAXPROCS = 3 → 3 个 P</text>
<rect x="193" y="207" width="721" height="90" rx="16" fill="#e1f2ea" stroke="#9dcfb9" stroke-width="2"/>
<text x="220" y="244" font-size="24" font-weight="700" fill="#1f725d">全局可运行队列</text><text x="220" y="273" font-size="18" fill="#597a6f">runnable G · 各 P 共享</text>
<g fill="#36a67e"><circle cx="575" cy="251" r="21"/><circle cx="635" cy="251" r="21"/><circle cx="695" cy="251" r="21"/><circle cx="755" cy="251" r="21"/><circle cx="815" cy="251" r="21"/></g>
<g text-anchor="middle" font-size="22" font-weight="700" fill="#fff"><text x="575" y="259">G</text><text x="635" y="259">G</text><text x="695" y="259">G</text><text x="755" y="259">G</text><text x="815" y="259">G</text></g>
<path d="M553 297 V322 H240 V343 M553 322 V343 M553 322 H864 V343" fill="none" stroke="#829b97" stroke-width="3" marker-end="url(#arr)"/><text x="590" y="318" font-size="17" fill="#6a8580">可从全局获取</text>
<g fill="#edf7f2" stroke="#aed7c4" stroke-width="2"><rect x="94" y="352" width="292" height="146" rx="14"/><rect x="407" y="352" width="292" height="146" rx="14"/><rect x="720" y="352" width="292" height="146" rx="14"/></g>
<g font-size="21" font-weight="700" fill="#226953"><text x="117" y="387">P1 本地可运行队列</text><text x="430" y="387">P2 本地可运行队列</text><text x="743" y="387">P3 本地可运行队列</text></g>
<g fill="#36a67e"><circle cx="142" cy="433" r="21"/><circle cx="196" cy="433" r="21"/><circle cx="250" cy="433" r="21"/><circle cx="304" cy="433" r="21"/><circle cx="455" cy="433" r="21"/><circle cx="509" cy="433" r="21"/><circle cx="768" cy="433" r="21"/></g>
<g fill="#fff" text-anchor="middle" font-size="20" font-weight="700"><text x="142" y="440">G</text><text x="196" y="440">G</text><text x="250" y="440">G</text><text x="304" y="440">G</text><text x="455" y="440">G</text><text x="509" y="440">G</text><text x="768" y="440">G</text></g>
<path d="M386 470 H401 M699 470 H714" fill="none" stroke="#9671ad" stroke-width="3" marker-end="url(#purple)"/>

<g fill="#fff3d8" stroke="#e8c987" stroke-width="2"><rect x="129" y="565" width="222" height="72" rx="12"/><rect x="442" y="565" width="222" height="72" rx="12"/><rect x="755" y="565" width="222" height="72" rx="12"/></g>
<g font-size="24" font-weight="700" fill="#987025"><text x="151" y="609">P1　调度资源</text><text x="464" y="609">P2　调度资源</text><text x="777" y="609">P3　调度资源</text></g>
<g fill="#e8f0fb" stroke="#b4cce9" stroke-width="2"><rect x="129" y="676" width="222" height="72" rx="12"/><rect x="442" y="676" width="222" height="72" rx="12"/><rect x="755" y="676" width="222" height="72" rx="12"/></g>
<g font-size="23" font-weight="700" fill="#426e9e"><text x="150" y="720">M1　执行 G</text><text x="463" y="720">M2　执行 G</text><text x="776" y="720">M3　执行 G</text></g>
<g fill="none" stroke="#789795" stroke-width="3" marker-end="url(#arr)"><path d="M240 498 V558"/><path d="M553 498 V558"/><path d="M866 498 V558"/><path d="M240 637 V669"/><path d="M553 637 V669"/><path d="M866 637 V669"/></g>
<rect x="165" y="791" width="776" height="58" rx="12" fill="#f0ebf7" stroke="#d2c6e2" stroke-width="2"/><text x="553" y="828" text-anchor="middle" font-size="21" font-weight="700" fill="#685886">操作系统调度器：安排线程 M 获得 CPU</text>
<path d="M240 748 V784 M553 748 V784 M866 748 V784" fill="none" stroke="#87939c" stroke-width="3" marker-end="url(#arr)"/>
<text x="553" y="891" text-anchor="middle" font-size="21" fill="#9b5f59">CPU 核心 1　　·　　CPU 核心 2　　·　　CPU 核心 3</text>
<rect x="1070" y="142" width="380" height="307" rx="20" fill="#eaf2fb" stroke="#c3d7eb" stroke-width="2"/>
<text x="1098" y="184" font-size="25" font-weight="700" fill="#345f83">网络等待与唤醒</text>
<text x="1098" y="228" font-size="20" fill="#456b82">G 发起网络请求</text><text x="1118" y="260" font-size="21" fill="#7190a0">↓</text><text x="1098" y="291" font-size="20" fill="#456b82">G 等待网络，暂时让出执行</text><text x="1118" y="323" font-size="21" fill="#7190a0">↓</text><text x="1098" y="354" font-size="20" fill="#456b82">netpoll 发现就绪，G 可运行</text><text x="1098" y="400" font-size="18" fill="#5d7989">重新排队后等待调度；M 可变化</text>
<path d="M977 712 H1030 V289 H1060" fill="none" stroke="#5485aa" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M1070 368 H1050 V251 H922" fill="none" stroke="#5485aa" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/>
<rect x="1070" y="473" width="380" height="197" rx="20" fill="#fff4e4" stroke="#efd4aa" stroke-width="2"/>
<text x="1098" y="514" font-size="25" font-weight="700" fill="#93692e">系统调用与 P 转交</text><text x="1098" y="554" font-size="20" fill="#7f6c4e">某些系统调用可能阻塞 M</text><text x="1098" y="588" font-size="20" fill="#7f6c4e">runtime 可将 P 交给其他 M</text><text x="1098" y="626" font-size="18" fill="#947f5c">M 与 P 的关联会动态变化</text>
<rect x="1070" y="695" width="380" height="230" rx="20" fill="#f1ebf8" stroke="#d8c8e8" stroke-width="2"/>
<text x="1098" y="736" font-size="25" font-weight="700" fill="#72578b">状态与调度</text><text x="1098" y="777" font-size="19" fill="#6f6680">runnable → running → 完成</text><text x="1098" y="811" font-size="19" fill="#6f6680">running → waiting → runnable</text><text x="1098" y="857" font-size="18" fill="#80748a">P 不是 CPU 核心；M 是系统线程</text><text x="1098" y="890" font-size="18" fill="#80748a">抢占可让其他 G 获得执行机会</text>
<rect x="50" y="964" width="1400" height="76" rx="15" fill="#dfefe8"/><text x="78" y="995" font-size="19" fill="#225a4e">工作窃取：任务少的 P 可从其他 P 的本地队列获取 G；本地队列满时，部分 G 可进入全局队列。</text><text x="78" y="1025" font-size="19" fill="#225a4e">Go runtime 调度 G，操作系统调度 M；并发上限与超时由业务设计。</text>
</g></svg>
