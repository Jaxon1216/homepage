<title id="title">主键 B+ 树：先找到 A 页，再找订单 6</title>
<desc id="desc">根页下界1、25、49，中间页下界1、9、17。查询6沿蓝线进入叶子页A，A页包含完整的八条示例订单，B、C和其他分支内容省略。叶子页之间双向连接。</desc>
