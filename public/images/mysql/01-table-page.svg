<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="553" viewBox="0 0 1000 553" role="img" aria-labelledby="title desc">
<title id="title">表是逻辑视图，页是存储单位</title>
<desc id="desc">同一张商品表在逻辑上有行和列，在 InnoDB 中组织到索引页里；页包含管理信息、行记录和页目录，默认页大小为 16 KiB。</desc>
<defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#AABACA" stroke-width="1.7"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#145DA8" stroke-width="1.7"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#936000" stroke-width="1.7"/></marker></defs>
<rect x="0" y="0" width="1000" height="553" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="40" y="49" fill="#172B42" font-size="30" font-weight="700" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">表是逻辑视图，页是存储单位</text>
<text x="40" y="86" fill="#53677C" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">SQL 看到库、表、行；存储引擎按页组织和读取数据。</text>
<rect x="45" y="118" width="250" height="36" rx="18" fill="#F3F6FA" stroke="none" stroke-width="1.5"/><text x="170" y="143" fill="#53677C" font-size="18" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">逻辑层：products 表</text>
<rect x="600" y="118" width="340" height="36" rx="18" fill="#E7F0FC" stroke="none" stroke-width="1.5"/><text x="770" y="143" fill="#145DA8" font-size="18" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">物理组织：InnoDB 索引页</text>
<rect x="45" y="172" width="445" height="274" rx="12" fill="#F3F6FA" stroke="#AABACA" stroke-width="1.5"/>
<text x="64" y="207" fill="#172B42" font-size="19" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">id</text>
<text x="126" y="207" fill="#172B42" font-size="19" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">name</text>
<text x="300" y="207" fill="#172B42" font-size="19" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">category</text>
<rect x="600" y="172" width="350" height="274" rx="12" fill="#F3F6FA" stroke="#145DA8" stroke-width="1.5"/>
<text x="620" y="207" fill="#172B42" font-size="23" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">一页中容纳多条记录</text>
<polyline points="510,308 578,308" fill="none" stroke="#145DA8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="544" y="276" fill="#145DA8" font-size="18" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">组织</text>
<text x="544" y="349" fill="#145DA8" font-size="18" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">成页</text>
<rect x="57" y="226" width="421" height="43" rx="5" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="72" y="255" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">1</text>
<text x="126" y="255" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Notebook</text>
<text x="300" y="255" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">stationery</text>
<rect x="57" y="276" width="421" height="43" rx="5" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="72" y="305" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">2</text>
<text x="126" y="305" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Desk lamp</text>
<text x="300" y="305" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">office</text>
<rect x="57" y="326" width="421" height="43" rx="5" fill="#E7F0FC" stroke="none" stroke-width="1.5"/>
<text x="72" y="355" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">6</text>
<text x="126" y="355" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Keyboard</text>
<text x="300" y="355" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">office</text>
<rect x="57" y="376" width="421" height="43" rx="5" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="72" y="405" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">10</text>
<text x="126" y="405" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Monitor</text>
<text x="300" y="405" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">office</text>
<rect x="618" y="228" width="314" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="775" y="261" fill="#172B42" font-size="21" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">页头等管理信息</text>
<rect x="618" y="292" width="314" height="52" rx="6" fill="#E7F0FC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="775" y="325" fill="#145DA8" font-size="21" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">行记录：1、2、3、……</text>
<rect x="618" y="356" width="314" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="775" y="389" fill="#172B42" font-size="21" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">页目录等辅助结构</text>
<text x="45" y="484" fill="#53677C" font-size="19" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">左侧只展示部分行与列；右侧只表达组织关系，并非真实字节布局。</text>
<text x="45" y="520" fill="#53677C" font-size="19" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">InnoDB 默认页大小为 16 KiB；页能放多少行，取决于行大小等因素。</text>
</svg>
