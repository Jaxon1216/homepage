<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="553" viewBox="0 0 1000 553" role="img" aria-labelledby="title desc">
<title id="title">表、行与数据页</title>
<desc id="desc">orders 表的行包含 id、user_id、amount、status。InnoDB 按页组织记录，每页还有管理信息与页目录。</desc>
<defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#AABACA" stroke-width="1.7"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#145DA8" stroke-width="1.7"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#936000" stroke-width="1.7"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#B13F28" stroke-width="1.7"/></marker><marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303C45" stroke-width="1.7"/></marker></defs>
<rect x="0" y="0" width="1000" height="553" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="40" y="49" fill="#172B42" font-size="30" font-weight="700" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">表、行与数据页</text>
<text x="40" y="86" fill="#53677C" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">SQL 看到表和行；InnoDB 将记录组织在数据页中。</text>
<rect x="45" y="118" width="250" height="36" rx="18" fill="#F3F6FA" stroke="none" stroke-width="1.5"/><text x="170" y="143" fill="#53677C" font-size="18" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">逻辑层：orders 表</text>
<rect x="600" y="118" width="340" height="36" rx="18" fill="#E7F0FC" stroke="none" stroke-width="1.5"/><text x="770" y="143" fill="#145DA8" font-size="18" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">物理组织：InnoDB 索引页</text>
<rect x="45" y="172" width="445" height="274" rx="12" fill="#F3F6FA" stroke="#AABACA" stroke-width="1.5"/>
<text x="64" y="207" fill="#172B42" font-size="19" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">id</text>
<text x="130" y="207" fill="#172B42" font-size="19" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">user_id</text>
<text x="260" y="207" fill="#172B42" font-size="19" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">amount</text>
<text x="371" y="207" fill="#172B42" font-size="19" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">status</text>
<rect x="600" y="172" width="350" height="274" rx="12" fill="#F3F6FA" stroke="#145DA8" stroke-width="1.5"/>
<text x="620" y="207" fill="#172B42" font-size="23" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">一页中容纳多条记录</text>
<polyline points="510,308 578,308" fill="none" stroke="#145DA8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="544" y="276" fill="#145DA8" font-size="18" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">组织</text>
<text x="544" y="349" fill="#145DA8" font-size="18" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">成页</text>
