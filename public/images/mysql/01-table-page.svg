<rect x="57" y="376" width="421" height="43" rx="5" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="72" y="405" fill="#172B42" font-size="20" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">8</text>
