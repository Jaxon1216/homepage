<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">A 页里怎样找到记录 6</title>
<desc id="desc">目录槽指向infimum、4、8、supremum。二分查目录确定4小于6且6小于等于8，从前一组末尾4沿单向记录链访问5、6。槽中实际保存位置。</desc>
<defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#AABACA" stroke-width="1.7"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#145DA8" stroke-width="1.7"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#936000" stroke-width="1.7"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#B13F28" stroke-width="1.7"/></marker><marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303C45" stroke-width="1.7"/></marker></defs>
<rect x="0" y="0" width="1000" height="580" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="40" y="49" fill="#172B42" font-size="30" font-weight="700" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">A 页里怎样找到记录 6</text>
<text x="40" y="88" fill="#53677C" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">同一个叶子页 A：先查目录，再沿单向记录链找 id = 6。</text>
<text x="40" y="161" fill="#172B42" font-size="23" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">页目录</text>
<rect x="220" y="125" width="110" height="55" rx="12" fill="#F3F6FA" stroke="#AABACA" stroke-width="1.5"/>
<text x="275" y="161" fill="#172B42" font-size="22" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">infimum</text>
<text x="275" y="114" fill="#53677C" font-size="17" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">槽 0</text>
<rect x="360" y="125" width="110" height="55" rx="12" fill="#E7F0FC" stroke="#AABACA" stroke-width="1.5"/>
<text x="415" y="161" fill="#172B42" font-size="22" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">4</text>
<text x="415" y="114" fill="#53677C" font-size="17" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">槽 1</text>
<rect x="500" y="125" width="110" height="55" rx="12" fill="#E7F0FC" stroke="#AABACA" stroke-width="1.5"/>
<text x="555" y="161" fill="#172B42" font-size="22" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">8</text>
<text x="555" y="114" fill="#53677C" font-size="17" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">槽 2</text>
<rect x="640" y="125" width="110" height="55" rx="12" fill="#F3F6FA" stroke="#AABACA" stroke-width="1.5"/>
<text x="695" y="161" fill="#172B42" font-size="22" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">supremum</text>
<text x="695" y="114" fill="#53677C" font-size="17" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">槽 3</text>
<text x="40" y="425" fill="#145DA8" font-size="22" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">① 比较槽指向的主键：4 &lt; 6 ≤ 8，确定在第二组</text>
<rect x="40" y="275" width="435" height="110" rx="12" fill="#F3F6FA" stroke="none" stroke-width="1.5"/>
<rect x="480" y="275" width="445" height="110" rx="12" fill="#EFF5E7" stroke="none" stroke-width="1.5"/>
<rect x="70" y="310" width="70" height="50" rx="4" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="105" y="343" fill="#172B42" font-size="25" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">1</text>
<polyline points="142,335 178,335" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="180" y="310" width="70" height="50" rx="4" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="215" y="343" fill="#172B42" font-size="25" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">2</text>
<polyline points="252,335 288,335" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="290" y="310" width="70" height="50" rx="4" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="325" y="343" fill="#172B42" font-size="25" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">3</text>
<polyline points="362,335 398,335" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="400" y="310" width="70" height="50" rx="4" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="435" y="343" fill="#172B42" font-size="25" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">4</text>
<polyline points="472,335 508,335" fill="none" stroke="#145DA8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="510" y="310" width="70" height="50" rx="4" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="545" y="343" fill="#172B42" font-size="25" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">5</text>
<polyline points="582,335 618,335" fill="none" stroke="#145DA8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="620" y="310" width="70" height="50" rx="4" fill="#E7F0FC" stroke="#145DA8" stroke-width="3"/>
<text x="655" y="343" fill="#172B42" font-size="25" font-weight="700" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">6</text>
<polyline points="692,335 728,335" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="730" y="310" width="70" height="50" rx="4" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="765" y="343" fill="#172B42" font-size="25" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">7</text>
<polyline points="802,335 838,335" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="840" y="310" width="70" height="50" rx="4" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="875" y="343" fill="#172B42" font-size="25" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">8</text>
<polyline points="415,182 415,253 435,253 435,308" fill="none" stroke="#B13F28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
<polyline points="555,182 555,260 875,260 875,308" fill="none" stroke="#B13F28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
<text x="258" y="300" fill="#53677C" font-size="18" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">第一组：1～4</text>
<text x="700" y="300" fill="#53677C" font-size="18" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">第二组：5～8</text>
<text x="40" y="465" fill="#145DA8" font-size="22" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">② 从前一个边界 4 开始，沿 next 找到 5、6；不是从 8 倒着找。</text>
<text x="40" y="510" fill="#53677C" font-size="19" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">槽中实际保存位置，上面用所指记录的名称或主键标注；系统记录的本体省略。</text>
<text x="40" y="548" fill="#53677C" font-size="19" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">红虚线：槽 → 组末记录；横向箭头：记录通过 next 单向连接。</text>
</svg>
