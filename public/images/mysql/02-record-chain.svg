<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="715" viewBox="0 0 1000 715" role="img" aria-labelledby="title desc">
<title id="title">记录头、记录链与头部哑节点</title>
<desc id="desc">订单6由记录头和业务字段组成，next引用记录7的位置。A页记录链从头部哑节点infimum，经过订单1至8，到尾部哨兵supremum。空页仍保留infimum到supremum的连接；dummy node是类比，infimum正式含义是页内最小边界系统记录。</desc>
<defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#AABACA" stroke-width="1.7"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#145DA8" stroke-width="1.7"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#936000" stroke-width="1.7"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#B13F28" stroke-width="1.7"/></marker><marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303C45" stroke-width="1.7"/></marker></defs>
<rect x="0" y="0" width="1000" height="715" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="40" y="49" fill="#172B42" font-size="30" font-weight="700" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">记录头、记录链与头部哑节点</text>
<text x="40" y="88" fill="#53677C" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">先看一条记录，再看它怎样通过 next 连到下一条。</text>
<rect x="40" y="125" width="400" height="150" rx="0" fill="#FBECEF" stroke="#D4ADB4" stroke-width="1.5"/>
<rect x="440" y="125" width="520" height="150" rx="0" fill="#EDF5E5" stroke="#AABF90" stroke-width="1.5"/>
<text x="240" y="166" fill="#172B42" font-size="23" font-weight="700" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">记录头：InnoDB 的管理信息</text>
<text x="70" y="210" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">next → 记录 7 的位置</text>
<text x="70" y="249" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">n_owned = 0（分组时再解释）</text>
<text x="700" y="166" fill="#172B42" font-size="23" font-weight="700" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">订单 6 的业务数据</text>
<text x="470" y="210" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">id = 6，user_id = 3</text>
<text x="470" y="249" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">amount = 70.00，status = paid</text>
<text x="40" y="331" fill="#172B42" font-size="24" font-weight="700" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">同一个 A 页：按主键顺序单向连接</text>
<rect x="40" y="365" width="120" height="80" rx="5" fill="#FFF1CC" stroke="#AABACA" stroke-width="1.5"/>
<text x="100" y="413" fill="#172B42" font-size="21" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">infimum</text>
<polyline points="162,405 178,405" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="180" y="365" width="60" height="80" rx="5" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="210" y="413" fill="#172B42" font-size="26" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">1</text>
<polyline points="242,405 258,405" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="260" y="365" width="60" height="80" rx="5" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="290" y="413" fill="#172B42" font-size="26" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">2</text>
<polyline points="322,405 338,405" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="340" y="365" width="60" height="80" rx="5" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="370" y="413" fill="#172B42" font-size="26" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">3</text>
<polyline points="402,405 418,405" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="420" y="365" width="60" height="80" rx="5" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="450" y="413" fill="#172B42" font-size="26" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">4</text>
<polyline points="482,405 498,405" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="500" y="365" width="60" height="80" rx="5" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="530" y="413" fill="#172B42" font-size="26" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">5</text>
<polyline points="562,405 578,405" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="580" y="365" width="60" height="80" rx="5" fill="#E7F0FC" stroke="#145DA8" stroke-width="2.5"/>
<text x="610" y="413" fill="#172B42" font-size="26" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">6</text>
<polyline points="642,405 658,405" fill="none" stroke="#145DA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="660" y="365" width="60" height="80" rx="5" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="690" y="413" fill="#172B42" font-size="26" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">7</text>
<polyline points="722,405 738,405" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="740" y="365" width="60" height="80" rx="5" fill="#FFFFFF" stroke="#AABACA" stroke-width="1.5"/>
<text x="770" y="413" fill="#172B42" font-size="26" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">8</text>
<polyline points="802,405 818,405" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="820" y="365" width="140" height="80" rx="5" fill="#FFF1CC" stroke="#AABACA" stroke-width="1.5"/>
<text x="890" y="413" fill="#172B42" font-size="21" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">supremum</text>
<text x="100" y="479" fill="#936000" font-size="21" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">头部哑节点</text>
<text x="890" y="479" fill="#936000" font-size="21" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">尾部哨兵</text>
<text x="40" y="561" fill="#172B42" font-size="23" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">空页时：</text>
<rect x="290" y="525" width="180" height="65" rx="12" fill="#FFF1CC" stroke="#AABACA" stroke-width="1.5"/>
<text x="380" y="566" fill="#172B42" font-size="24" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">infimum</text>
<polyline points="473,557 647,557" fill="none" stroke="#AABACA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="650" y="525" width="180" height="65" rx="12" fill="#FFF1CC" stroke="#AABACA" stroke-width="1.5"/>
<text x="740" y="566" fill="#172B42" font-size="24" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">supremum</text>
<text x="40" y="644" fill="#53677C" font-size="20" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">infimum 可类比链表里的 dummy node；首尾都是系统记录，不保存订单业务数据。</text>
<text x="40" y="681" fill="#53677C" font-size="19" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">这里只展开 next、n_owned，省略记录的其他信息；方块位置表示逻辑顺序。</text>
</svg>
