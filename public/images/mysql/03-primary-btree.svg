<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc">
<title id="title">B+ 树：从目录页走到数据页</title>
<desc id="desc">两层 B+ 树的根页含下界 1、5、9 和子页引用。查找 id 6 时选择下界 5 的页 B，在该叶子页查找 Keyboard 的行记录。三个叶子页按主键顺序双向连接。每页四行是人为教学假设。</desc>
<defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#AABACA" stroke-width="1.7"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#145DA8" stroke-width="1.7"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#936000" stroke-width="1.7"/></marker></defs>
<rect x="0" y="0" width="1000" height="740" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="40" y="49" fill="#172B42" font-size="30" font-weight="700" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">B+ 树：从目录页走到数据页</text>
<text x="40" y="88" fill="#53677C" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">查询 id = 6：上层指路，叶子页保存行记录。</text>
<rect x="370" y="112" width="330" height="36" rx="18" fill="#F3F6FA" stroke="none" stroke-width="1.5"/><text x="535" y="137" fill="#53677C" font-size="18" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">非叶子页：键值 + 子页引用</text>
<rect x="235" y="168" width="530" height="91" rx="12" fill="#F3F6FA" stroke="#AABACA" stroke-width="1.5"/>
<rect x="245" y="178" width="160" height="71" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="325" y="208" fill="#172B42" font-size="22" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">下界 1</text>
<text x="325" y="235" fill="#53677C" font-size="17" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">指向页 A</text>
<polyline points="325,259 325,292 170,292 170,335" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
<rect x="40" y="338" width="260" height="264" rx="12" fill="#F3F6FA" stroke="#AABACA" stroke-width="1.5"/><text x="58" y="372" fill="#172B42" font-size="22" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">叶子页 A</text><text x="58" y="405" fill="#53677C" font-size="17" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">id</text><text x="98" y="405" fill="#53677C" font-size="17" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">name（其他列省略）</text><rect x="50" y="420" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="68" y="448" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">1</text><text x="108" y="448" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Notebook</text><rect x="50" y="463" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="68" y="491" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">2</text><text x="108" y="491" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Desk lamp</text><rect x="50" y="506" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="68" y="534" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">3</text><text x="108" y="534" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Pen</text><rect x="50" y="549" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="68" y="577" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">4</text><text x="108" y="577" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Mug</text>
<rect x="420" y="178" width="160" height="71" rx="7" fill="#E7F0FC" stroke="#145DA8" stroke-width="2"/>
<text x="500" y="208" fill="#145DA8" font-size="22" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">下界 5</text>
<text x="500" y="235" fill="#53677C" font-size="17" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">指向页 B</text>
<polyline points="500,259 500,292 500,292 500,335" fill="none" stroke="#145DA8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="370" y="338" width="260" height="264" rx="12" fill="#F3F6FA" stroke="#145DA8" stroke-width="2.5"/><text x="388" y="372" fill="#145DA8" font-size="22" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">叶子页 B</text><text x="388" y="405" fill="#53677C" font-size="17" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">id</text><text x="428" y="405" fill="#53677C" font-size="17" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">name（其他列省略）</text><rect x="380" y="420" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="398" y="448" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">5</text><text x="438" y="448" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Mouse</text><rect x="380" y="463" width="240" height="42" rx="4" fill="#E7F0FC" stroke="#145DA8" stroke-width="2"/><text x="398" y="491" fill="#172B42" font-size="21" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">6</text><text x="438" y="491" fill="#172B42" font-size="21" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Keyboard</text><rect x="380" y="506" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="398" y="534" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">7</text><text x="438" y="534" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Cable</text><rect x="380" y="549" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="398" y="577" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">8</text><text x="438" y="577" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Towel</text>
<rect x="595" y="178" width="160" height="71" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="675" y="208" fill="#172B42" font-size="22" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">下界 9</text>
<text x="675" y="235" fill="#53677C" font-size="17" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">指向页 C</text>
<polyline points="675,259 675,292 830,292 830,335" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
<rect x="700" y="338" width="260" height="264" rx="12" fill="#F3F6FA" stroke="#AABACA" stroke-width="1.5"/><text x="718" y="372" fill="#172B42" font-size="22" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">叶子页 C</text><text x="718" y="405" fill="#53677C" font-size="17" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">id</text><text x="758" y="405" fill="#53677C" font-size="17" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">name（其他列省略）</text><rect x="710" y="420" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="728" y="448" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">9</text><text x="768" y="448" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Eraser</text><rect x="710" y="463" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="728" y="491" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">10</text><text x="768" y="491" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Monitor</text><rect x="710" y="506" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="728" y="534" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">11</text><text x="768" y="534" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Charger</text><rect x="710" y="549" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="728" y="577" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">12</text><text x="768" y="577" fill="#172B42" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">Basket</text>
<text x="525" y="316" fill="#145DA8" font-size="19" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">5 ≤ 6 &lt; 9，进入页 B</text>
<polyline points="302,567 367,567" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
<polyline points="632,567 697,567" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
<text x="500" y="637" fill="#53677C" font-size="20" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">叶子页按键值顺序双向连接，方便继续扫描</text>
<text x="40" y="678" fill="#53677C" font-size="18" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">人为画成每页 4 行以展示分支；真实的 12 行通常不需要这 3 个叶子页。</text>
<text x="40" y="707" fill="#53677C" font-size="18" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">导航键简化表示；省略最左项最小标志、内部格式及页外存储。</text>
</svg>
