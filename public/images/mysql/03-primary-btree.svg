<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="725" viewBox="0 0 1000 725" role="img" aria-labelledby="title desc">
<title id="title">B+ 树：从导航页走到记录所在页</title>
<desc id="desc">根页用简化下界1、4、7引用三个叶子页，分别显示订单1至3、4至6、7至8。查找id6时进入页B，取得金额70.00的订单记录。叶子页双向连接。</desc>
<defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#AABACA" stroke-width="1.7"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#145DA8" stroke-width="1.7"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#936000" stroke-width="1.7"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#B13F28" stroke-width="1.7"/></marker><marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303C45" stroke-width="1.7"/></marker></defs>
<rect x="0" y="0" width="1000" height="725" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="40" y="49" fill="#172B42" font-size="30" font-weight="700" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">B+ 树：从导航页走到记录所在页</text>
<text x="40" y="88" fill="#53677C" font-size="21" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">查询 id = 6：上层指路，叶子页保存行记录。</text>
<rect x="350" y="112" width="340" height="36" rx="18" fill="#F3F6FA" stroke="none" stroke-width="1.5"/><text x="520" y="137" fill="#53677C" font-size="18" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">非叶子页：导航键 + 子页引用</text>
<rect x="235" y="168" width="530" height="91" rx="12" fill="#F3F6FA" stroke="#AABACA" stroke-width="1.5"/>
<rect x="245" y="178" width="160" height="71" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="325" y="208" fill="#172B42" font-size="22" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">下界 1</text>
<text x="325" y="235" fill="#53677C" font-size="17" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">指向页 A</text>
<polyline points="325,259 325,292 170,292 170,335" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="40" y="338" width="260" height="249" rx="12" fill="#F3F6FA" stroke="#AABACA" stroke-width="1.5"/><text x="58" y="372" fill="#172B42" font-size="22" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">叶子页 A</text><text x="68" y="406" fill="#53677C" font-size="19" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">id</text><text x="150" y="406" fill="#53677C" font-size="19" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">amount</text><rect x="50" y="422" width="240" height="46" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="70" y="453" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">1</text><text x="150" y="453" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">120.00</text><rect x="50" y="471" width="240" height="46" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="70" y="502" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">2</text><text x="150" y="502" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">80.00</text><rect x="50" y="520" width="240" height="46" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="70" y="551" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">3</text><text x="150" y="551" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">160.00</text>
<rect x="420" y="178" width="160" height="71" rx="7" fill="#E7F0FC" stroke="#145DA8" stroke-width="2"/>
<text x="500" y="208" fill="#145DA8" font-size="22" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">下界 4</text>
<text x="500" y="235" fill="#53677C" font-size="17" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">指向页 B</text>
<polyline points="500,259 500,292 500,292 500,335" fill="none" stroke="#145DA8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="370" y="338" width="260" height="249" rx="12" fill="#F3F6FA" stroke="#145DA8" stroke-width="2.5"/><text x="388" y="372" fill="#145DA8" font-size="22" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">叶子页 B</text><text x="398" y="406" fill="#53677C" font-size="19" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">id</text><text x="480" y="406" fill="#53677C" font-size="19" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">amount</text><rect x="380" y="422" width="240" height="46" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="400" y="453" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">4</text><text x="480" y="453" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">90.00</text><rect x="380" y="471" width="240" height="46" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="400" y="502" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">5</text><text x="480" y="502" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">60.00</text><rect x="380" y="520" width="240" height="46" rx="4" fill="#E7F0FC" stroke="#145DA8" stroke-width="2"/><text x="400" y="551" fill="#172B42" font-size="23" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">6</text><text x="480" y="551" fill="#172B42" font-size="23" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">70.00</text>
<rect x="595" y="178" width="160" height="71" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="675" y="208" fill="#172B42" font-size="22" font-weight="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">下界 7</text>
<text x="675" y="235" fill="#53677C" font-size="17" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">指向页 C</text>
<polyline points="675,259 675,292 830,292 830,335" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)"/>
<rect x="700" y="338" width="260" height="249" rx="12" fill="#F3F6FA" stroke="#AABACA" stroke-width="1.5"/><text x="718" y="372" fill="#172B42" font-size="22" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">叶子页 C</text><text x="728" y="406" fill="#53677C" font-size="19" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">id</text><text x="810" y="406" fill="#53677C" font-size="19" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">amount</text><rect x="710" y="422" width="240" height="46" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="730" y="453" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">7</text><text x="810" y="453" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">300.00</text><rect x="710" y="471" width="240" height="46" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="730" y="502" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">8</text><text x="810" y="502" fill="#172B42" font-size="23" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">900.00</text>
<text x="525" y="316" fill="#145DA8" font-size="19" font-weight="600" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">4 ≤ 6 &lt; 7，进入页 B</text>
<polyline points="302,557 367,557" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)" marker-start="url(#arrow-line)"/>
<polyline points="632,557 697,557" fill="none" stroke="#AABACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-line)" marker-start="url(#arrow-line)"/>
<text x="500" y="622" fill="#53677C" font-size="20" font-weight="400" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">叶子页按主键顺序双向连接；此处只显示 id、amount 两列。</text>
<text x="40" y="663" fill="#53677C" font-size="18" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">为展示分支，把 8 行人为画成 3 个叶子页；真实小表通常只需一个叶子页。</text>
<text x="40" y="693" fill="#53677C" font-size="18" font-weight="400" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">导航键为简化下界，省略最左项最小标志、内部格式及页外存储。</text>
</svg>
