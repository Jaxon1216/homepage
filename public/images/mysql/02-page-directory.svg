<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="title desc">
<title id="title">A 页的目录槽、分组与记录头</title>
<desc id="desc">A页包含订单1至8。四个目录槽分别指向infimum、4、8、supremum，对应n_owned为1、4、4、1。infimum可类比头部哑节点，supremum为尾部哨兵，都是系统记录。记录头和用户业务字段分开标注。记录沿next单向连接，6高亮。图按逻辑顺序绘制，不表示真实物理偏移。</desc>
