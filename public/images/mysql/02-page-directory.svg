<title id="title">数据页：页目录、分组与记录链</title>
<desc id="desc">参考用户提供的页目录图重绘。绿色目录区包含四个槽，分别指向 infimum、主键4、主键8和supremum。每条用户记录分为n_owned、next指针、主键id、行数据四格。两组用户记录分别为1至4、5至8，组末记录的n_owned为4，其余为0；首尾系统记录各自拥有1条。黑线表示下一条记录，红色虚线表示槽指向的组末记录。</desc>
