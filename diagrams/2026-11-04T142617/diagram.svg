<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1810" viewBox="0 0 1600 1810">
<rect width="1600" height="1810" fill="#f6f7f4"/>
<text x="60" y="73" font-family="sans-serif" font-size="20" font-weight="700" fill="#197a65">后端运行模型 / 从代码到请求</text>
<text x="60" y="130" font-family="sans-serif" font-size="42" font-weight="700" fill="#172c35">一份代码，如何被线程执行？</text>
<text x="60" y="169" font-family="sans-serif" font-size="20" fill="#557079">先分清：代码是文件，进程是运行实例，线程执行实际调用到的代码。</text>
<!-- main container -->
<rect x="50" y="205" width="1500" height="805" rx="24" fill="#ffffff" stroke="#dbe4e1" stroke-width="2"/>
<text x="80" y="249" font-family="sans-serif" font-size="23" font-weight="700" fill="#172c35">01  从文件到运行中的程序</text>
<!-- file -->
<rect x="80" y="286" width="280" height="415" rx="18" fill="#f1f5fb" stroke="#cfdbed" stroke-width="2"/>
<path d="M110 329 L110 303 L330 303" stroke="#3b6da4" stroke-width="4" fill="none"/>
<text x="108" y="348" font-family="sans-serif" font-size="25" font-weight="700" fill="#254b73">磁盘上的 app.js</text>
<text x="108" y="390" font-family="monospace" font-size="19" fill="#334d5d">启动：注册路由</text>
<text x="108" y="432" font-family="monospace" font-size="19" fill="#334d5d">请求：执行 handler</text>
<line x1="108" y1="459" x2="330" y2="459" stroke="#cfdbed" stroke-width="2"/>
<text x="108" y="504" font-family="sans-serif" font-size="19" fill="#405c6b">代码是指令的描述</text>
<text x="108" y="540" font-family="sans-serif" font-size="19" fill="#405c6b">定义函数 ≠ 执行函数</text>
<text x="108" y="598" font-family="sans-serif" font-size="18" fill="#607987">同一份代码可以启动</text>
<text x="108" y="630" font-family="sans-serif" font-size="18" fill="#607987">多个独立进程</text>
<!-- run arrows -->
<polyline points="360,397 390,397 390,368 425,368" stroke="#547c84" stroke-width="3" fill="none"/>
<polygon points="425,368 413,362 413,374" fill="#547c84"/>
<text x="365" y="337" font-family="sans-serif" font-size="16" fill="#547078">启动</text>
<polyline points="360,585 390,585 390,788 425,788" stroke="#81928d" stroke-width="3" fill="none"/>
<polygon points="425,788 413,782 413,794" fill="#81928d"/>
<!-- process A -->
<rect x="425" y="286" width="745" height="435" rx="18" fill="#eff8f4" stroke="#74b8a0" stroke-width="2"/>
<text x="455" y="330" font-family="sans-serif" font-size="25" font-weight="700" fill="#176f59">Node.js 进程 A</text>
<text x="760" y="329" font-family="sans-serif" font-size="18" fill="#52746b">一个运行中的程序实例</text>
<rect x="455" y="351" width="685" height="116" rx="13" fill="#ffffff" stroke="#a7d6c4"/>
<circle cx="486" cy="384" r="13" fill="#187d65"/>
<text x="515" y="390" font-family="sans-serif" font-size="22" font-weight="700" fill="#176f59">JS 主线程</text>
<text x="515" y="424" font-family="sans-serif" font-size="19" fill="#294b43">启动时注册路由；请求到来时执行对应的 handler。</text>
<text x="515" y="452" font-family="sans-serif" font-size="18" fill="#526d66">每次执行实际调用到的代码，不是把整个项目跑一遍。</text>
<rect x="455" y="482" width="685" height="81" rx="13" fill="#f8fbf8" stroke="#c6ded4"/>
<circle cx="486" cy="522" r="13" fill="#96bdb0"/>
<text x="515" y="514" font-family="sans-serif" font-size="20" font-weight="700" fill="#345b50">其他运行时线程</text>
<text x="515" y="543" font-family="sans-serif" font-size="18" fill="#526d66">执行部分底层任务，不会为每个请求自动新建线程。</text>
<rect x="455" y="579" width="685" height="110" rx="13" fill="#fff8eb" stroke="#ecd4a6"/>
<text x="480" y="617" font-family="sans-serif" font-size="20" font-weight="700" fill="#8b6020">数据库连接池</text>
<text x="480" y="650" font-family="sans-serif" font-size="18" fill="#806b48">查询时使用连接；连接用完后可复用。</text>
<circle cx="1023" cy="617" r="15" fill="#edbe6e"/>
<text x="1008" y="655" font-family="sans-serif" font-size="17" fill="#745a32">连接 1</text>
<circle cx="1092" cy="617" r="15" fill="#edbe6e"/>
<text x="1077" y="655" font-family="sans-serif" font-size="17" fill="#745a32">连接 2</text>
<!-- separate process B -->
<rect x="425" y="746" width="745" height="177" rx="18" fill="#f2f6f4" stroke="#c8d8d1" stroke-width="2"/>
<text x="455" y="789" font-family="sans-serif" font-size="24" font-weight="700" fill="#395e52">Node.js 进程 B</text>
<text x="455" y="826" font-family="sans-serif" font-size="19" fill="#527169">同一份代码再次启动 → 另一个独立进程</text>
<text x="455" y="860" font-family="sans-serif" font-size="19" fill="#527169">有自己的普通内存、JS 主线程、连接池</text>
<text x="455" y="901" font-family="sans-serif" font-size="17" fill="#738c82">每个进程都能处理多个请求；进程数取决于部署。</text>
<!-- database -->
<path d="M1255 451 L1255 581 Q1360 631 1465 581 L1465 451" fill="#dae8f7" stroke="#7196b9" stroke-width="2"/>
<ellipse cx="1360" cy="451" rx="105" ry="30" fill="#edf4fc" stroke="#7196b9" stroke-width="2"/>
<text x="1303" y="525" font-family="sans-serif" font-size="25" font-weight="700" fill="#345e83">MySQL</text>
<text x="1297" y="558" font-family="sans-serif" font-size="17" fill="#527492">独立的服务进程</text>
<polyline points="1140,615 1212,615 1212,525 1255,525" fill="none" stroke="#cd9a45" stroke-width="3"/>
<polygon points="1255,525 1243,519 1243,531" fill="#cd9a45"/>
<text x="1190" y="656" font-family="sans-serif" font-size="17" fill="#8c7045">网络连接</text>
<polyline points="1170,825 1212,825 1212,573 1255,573" fill="none" stroke="#b8c7d2" stroke-width="3"/>
<polygon points="1255,573 1243,567 1243,579" fill="#b8c7d2"/>
<text x="1250" y="724" font-family="sans-serif" font-size="18" fill="#557078">连接是通信通道，</text>
<text x="1250" y="755" font-family="sans-serif" font-size="18" fill="#557078">不是线程。</text>
<text x="80" y="974" font-family="sans-serif" font-size="18" fill="#59716c">启动一个进程 ≠ 只有一个线程；同一份代码也可以启动多个进程。</text>
<!-- timeline -->
<rect x="50" y="1035" width="1500" height="291" rx="24" fill="#1e353b"/>
<text x="80" y="1083" font-family="sans-serif" font-size="24" font-weight="700" fill="#f6faf7">02  两个请求如何共用同一个 JS 主线程？</text>
<text x="80" y="1124" font-family="sans-serif" font-size="18" fill="#bfd4cf">假设查询使用真正的异步 I/O；这里只画 JS 执行片段的一种可能顺序。</text>
<line x1="95" y1="1181" x2="1497" y2="1181" stroke="#91aca6" stroke-width="3"/>
<polygon points="1497,1181 1484,1174 1484,1188" fill="#91aca6"/>
<rect x="120" y="1150" width="300" height="62" rx="12" fill="#74c6aa"/>
<text x="145" y="1189" font-family="sans-serif" font-size="20" font-weight="700" fill="#153e32">A：执行 JS、发起查询</text>
<rect x="474" y="1150" width="300" height="62" rx="12" fill="#87b7df"/>
<text x="499" y="1189" font-family="sans-serif" font-size="20" font-weight="700" fill="#183b57">B：执行 JS、发起查询</text>
<rect x="832" y="1150" width="237" height="62" rx="12" fill="#74c6aa"/>
<text x="856" y="1189" font-family="sans-serif" font-size="20" font-weight="700" fill="#153e32">A：结果返回后继续</text>
<rect x="1120" y="1150" width="237" height="62" rx="12" fill="#87b7df"/>
<text x="1144" y="1189" font-family="sans-serif" font-size="20" font-weight="700" fill="#183b57">B：结果返回后继续</text>
<text x="104" y="1268" font-family="sans-serif" font-size="19" fill="#d7e7e1">两个请求的等待时间可以重叠；这个主线程同一时刻只执行一段 JS。</text>
<text x="104" y="1299" font-family="sans-serif" font-size="18" fill="#a5c4b9">长时间同步计算会占住主线程，其他 JS 回调需要等待。</text>
<!-- distinction pool -->
<text x="65" y="1381" font-family="sans-serif" font-size="24" font-weight="700" fill="#172c35">03  容易混淆的两个“池”</text>
<rect x="50" y="1402" width="730" height="112" rx="18" fill="#e4f1ea"/>
<circle cx="95" cy="1458" r="21" fill="#3c9478"/>
<text x="137" y="1450" font-family="sans-serif" font-size="22" font-weight="700" fill="#216b54">线程池</text>
<text x="137" y="1481" font-family="sans-serif" font-size="19" fill="#406b5d">复用线程，执行任务；线程是执行通道。</text>
<rect x="800" y="1402" width="750" height="112" rx="18" fill="#fcf0d7"/>
<circle cx="845" cy="1458" r="21" fill="#d8a650"/>
<text x="887" y="1450" font-family="sans-serif" font-size="22" font-weight="700" fill="#8a6024">连接池</text>
<text x="887" y="1481" font-family="sans-serif" font-size="19" fill="#836f4b">复用连接，联系数据库；连接是通信通道。</text>
<!-- comparison -->
<text x="65" y="1574" font-family="sans-serif" font-size="24" font-weight="700" fill="#172c35">04  “单线程”每次都要问：是哪一部分？</text>
<rect x="50" y="1600" width="478" height="145" rx="18" fill="#ffffff" stroke="#dfe7e3"/>
<text x="76" y="1640" font-family="sans-serif" font-size="22" font-weight="700" fill="#187a62">Node.js</text>
<text x="76" y="1675" font-family="sans-serif" font-size="18" fill="#405e58">普通 JS 主要在一个主线程执行；</text>
<text x="76" y="1706" font-family="sans-serif" font-size="18" fill="#405e58">进程仍可能有其他线程。</text>
<rect x="560" y="1600" width="478" height="145" rx="18" fill="#ffffff" stroke="#dfe7e3"/>
<text x="586" y="1640" font-family="sans-serif" font-size="22" font-weight="700" fill="#b1664d">Redis</text>
<text x="586" y="1675" font-family="sans-serif" font-size="18" fill="#405e58">单实例的普通命令主要串行执行；</text>
<text x="586" y="1706" font-family="sans-serif" font-size="18" fill="#405e58">进程仍可能有其他线程。</text>
<rect x="1070" y="1600" width="480" height="145" rx="18" fill="#ffffff" stroke="#dfe7e3"/>
<text x="1096" y="1640" font-family="sans-serif" font-size="22" font-weight="700" fill="#416eaa">Python / CPython</text>
<text x="1096" y="1675" font-family="sans-serif" font-size="18" fill="#405e58">可以有多线程；常见 GIL 限制</text>
<text x="1096" y="1706" font-family="sans-serif" font-size="18" fill="#405e58">同进程 Python 代码同时并行。</text>
<text x="75" y="1782" font-family="sans-serif" font-size="17" fill="#748985">图中线程、连接和请求不是一一对应；版本、运行时和部署方式会改变具体细节。</text>
</svg>
